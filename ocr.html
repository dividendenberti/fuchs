<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF OCR Scan to Clean PDF – Fuchs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2b7de9; --blue-light: #e8f1fd; --blue-border: #a8c8f8;
      --blue-dark: #1a5cbf; --bg: #f0f4fb; --white: #ffffff;
      --text: #1e2a3a; --muted: #6b7a8d;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px 60px; }
    header { width: 100%; max-width: 780px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
    .brand { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
    .card { background: var(--white); border-radius: 16px; box-shadow: 0 8px 32px rgba(43,125,233,0.15); padding: 40px; width: 100%; max-width: 780px; }
    .dropzone { border: 2.5px dashed var(--blue-border); border-radius: 14px; background: var(--blue-light); padding: 52px 24px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .dropzone:hover, .dropzone.dragover { border-color: var(--blue); background: #d6e8fb; transform: translateY(-1px); box-shadow: 0 4px 18px rgba(43,125,233,0.13); }
    .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .dropzone svg { width: 52px; height: 52px; color: var(--blue); margin-bottom: 14px; }
    .dz-label { font-size: 1rem; font-weight: 600; color: var(--blue); margin-bottom: 4px; }
    .dz-sub { font-size: 0.82rem; color: var(--muted); }
    #file-preview { display: none; align-items: center; gap: 12px; margin-top: 18px; background: var(--blue-light); border: 1.5px solid var(--blue-border); border-radius: 10px; padding: 12px 16px; }
    #file-preview.show { display: flex; }
    #file-preview svg { width: 28px; height: 28px; color: var(--blue); flex-shrink: 0; }
    #file-name { font-size: 0.88rem; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-btn { background: none; border: none; cursor: pointer; color: #c0392b; font-size: 1.1rem; padding: 2px 6px; border-radius: 6px; }
    .remove-btn:hover { background: #fdecea; }
    .submit-btn { margin-top: 28px; width: 100%; padding: 16px; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s, transform 0.15s, box-shadow 0.2s; }
    .submit-btn:hover:not(:disabled) { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(43,125,233,0.28); }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    #status { display: none; margin-top: 20px; border-radius: 10px; padding: 14px 18px; font-size: 0.9rem; font-weight: 500; }
    #status.info    { background:#e8f1fd; color:#1a5cbf; border:1.5px solid #a8c8f8; display:block; }
    #status.error   { background:#fdecea; color:#c0392b; border:1.5px solid #f5b7b1; display:block; }
    #status.success { background:#eafaf1; color:#1d8348; border:1.5px solid #a9dfbf; display:block; }
    .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result-section { display: none; margin-top: 28px; border-top: 1.5px solid #e4edf8; padding-top: 24px; }
    #result-section.show { display: block; }
    .result-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .badge { background: #eafaf1; color: #1d8348; border: 1px solid #a9dfbf; border-radius: 20px; font-size: 0.73rem; font-weight: 600; padding: 2px 10px; }
    #pdf-viewer-wrap { width: 100%; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--blue-border); margin-bottom: 14px; background: #f7f9fc; }
    #pdf-viewer { width: 100%; height: 560px; display: block; border: none; }
    .download-btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 24px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s, transform 0.15s; }
    .download-btn:hover { background: var(--blue-dark); transform: translateY(-1px); }
    footer-note { display: block; text-align: center; margin-top: 28px; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <h1>PDF OCR Scan to Clean PDF</h1>
  <a href="index.html" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:var(--blue); color:#fff; border-radius:8px; font-size:0.9rem; font-weight:600; text-decoration:none; transition:background 0.2s;">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
  </svg>
  Home
</a>
</header>

<div class="card">

  <div class="dropzone" id="dropzone">
    <input type="file" id="pdf-input" accept="application/pdf" />
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5v-9m0 0-3.75 3.75M12 7.5l3.75 3.75M3 15.75A6.75 6.75 0 0 1 9.75 9h.25M21 15.75A6.75 6.75 0 0 0 14.25 9H14" />
    </svg>
    <div class="dz-label">PDF hierher ziehen oder klicken</div>
    <div class="dz-sub">Nur 1 PDF-Datei möglich</div>
  </div>

  <div id="file-preview">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
    </svg>
    <span id="file-name">–</span>
    <button class="remove-btn" id="remove-btn">✕</button>
  </div>

  <button class="submit-btn" id="submit-btn" disabled>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
    OCR-Verarbeitung starten
  </button>

  <div id="status"></div>

  <div id="result-section">
    <div class="result-title">
      Ergebnis <span class="badge">✓ Fertig</span>
    </div>
    <div id="pdf-viewer-wrap">
      <iframe id="pdf-viewer" title="Vorschau Clean PDF"></iframe>
    </div>
    <a id="download-link" class="download-btn" download="clean-output.pdf">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
      Clean PDF herunterladen
    </a>
  </div>

</div>

<footer-note>© FUCHS-Versicherung – PDF OCR Scan to Clean PDF</footer-note>

<script>
  const dropzone  = document.getElementById('dropzone');
  const input     = document.getElementById('pdf-input');
  const preview   = document.getElementById('file-preview');
  const fileName  = document.getElementById('file-name');
  const removeBtn = document.getElementById('remove-btn');
  const submitBtn = document.getElementById('submit-btn');
  const statusEl  = document.getElementById('status');
  const resultSec = document.getElementById('result-section');
  const pdfViewer = document.getElementById('pdf-viewer');
  const dlLink    = document.getElementById('download-link');

  let selectedFile = null;
  let objectUrl = null;

  function setFile(file) {
    if (!file || file.type !== 'application/pdf') {
      showStatus('Bitte nur eine gültige PDF-Datei auswählen.', 'error'); return;
    }
    selectedFile = file;
    fileName.textContent = file.name;
    preview.classList.add('show');
    submitBtn.disabled = false;
    hideResult(); clearStatus();
  }

  function clearFile() {
    selectedFile = null; input.value = '';
    preview.classList.remove('show'); submitBtn.disabled = true;
    hideResult(); clearStatus();
  }

  function showStatus(msg, type) { statusEl.textContent = msg; statusEl.className = type; }
  function clearStatus() { statusEl.textContent = ''; statusEl.className = ''; statusEl.style.display = 'none'; }

  function hideResult() {
    resultSec.classList.remove('show');
    pdfViewer.src = '';
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  }

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', () => { if (input.files[0]) setFile(input.files[0]); });
  removeBtn.addEventListener('click', clearFile);

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<div class="spinner"></div> Wird verarbeitet…';
    showStatus('PDF wird verarbeitet. Bitte warten…', 'info');
    hideResult();

    const formData = new FormData();
    formData.append('file', selectedFile, selectedFile.name);

    try {
      const response = await fetch(
        'https://n8n.fuchs-versicherung.at/webhook/20be944d-120c-4897-8bcb-eb67676754f0',
        { method: 'POST', headers: { 'Authorization': 'Bearer wert1234' }, body: formData }
      );

      if (!response.ok) throw new Error(`Server-Fehler: ${response.status} ${response.statusText}`);

      const json = await response.json();

      // Response is an array [ { data: "base64..." } ] or object { data: "base64..." }
      let base64 = null;

      if (Array.isArray(json)) {
        base64 = json[0]?.data ?? null;
      } else {
        base64 = json.data ?? null;
      }

      if (!base64) throw new Error('Kein PDF-Inhalt in der Server-Antwort gefunden (Feld "data" fehlt oder leer).');

      // Strip potential data URI prefix and whitespace
      const clean = base64.replace(/^data:[^;]+;base64,/, '').replace(/\s/g, '');

      // Decode base64 → Blob
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'application/pdf' });

      objectUrl = URL.createObjectURL(blob);
      pdfViewer.src = objectUrl;
      dlLink.href = objectUrl;
      dlLink.download = 'clean-' + selectedFile.name;
      resultSec.classList.add('show');

      showStatus('OCR-Verarbeitung erfolgreich abgeschlossen!', 'success');

    } catch (err) {
      console.error(err);
      showStatus('Fehler: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        OCR-Verarbeitung starten`;
    }
  });
</script>
</body>
</html>
